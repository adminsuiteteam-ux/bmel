<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 140" width="630" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;display=swap');
      .bmel-box-bg { fill: #03045E; }
      .bmel-box-text { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 900; fill: #FFFFFF; font-size: 44px; letter-spacing: -1px; }
      .brownforte-text { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 800; fill: #4B5563; font-size: 60px; letter-spacing: 2px; }
      .divider-line { stroke: #00B4D8; stroke-width: 4.5; stroke-linecap: round; }
      .subtext { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 800; fill: #6B7280; font-size: 23px; font-style: italic; letter-spacing: 1px; }
    </style>
  </defs>
  
  <!-- Sky Blue BMEL Box -->
  <rect class="bmel-box-bg" x="0" y="0" width="140" height="140" rx="8" />
  <text class="bmel-box-text" x="70" y="86" text-anchor="middle">BMEL</text>

  <!-- BROWNFORTE Text -->
  <text class="brownforte-text" x="165" y="68">BROWNFORTE</text>

  <!-- Divider Line -->
  <line class="divider-line" x1="165" y1="83" x2="625" y2="83" />

  <!-- MECHANICAL ENGINEERING LIMITED Text -->
  <text class="subtext" x="165" y="118">MECHANICAL ENGINEERING LIMITED</text>
</svg>
